<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Báscula pélvica">
  <!-- RuDaMi · ilustración de ejercicio · trazo propio -->
  <rect width="480" height="360" fill="#f8f6f1"/>
  <line x1="40" y1="306" x2="440" y2="306" stroke="#d8d2c6" stroke-width="6" stroke-linecap="round"/>
  <g stroke="#2f3238" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- brazo apoyado -->
    <path d="M118 294 L210 296"/>
    <!-- tronco tumbado -->
    <path d="M112 284 L250 292"/>
    <!-- muslo y pierna, rodillas flexionadas -->
    <path d="M250 292 L318 206"/>
    <path d="M318 206 L348 302"/>
  </g>
  <circle cx="82" cy="278" r="23" fill="#f8f6f1" stroke="#2f3238" stroke-width="7"/>
  <!-- la pelvis bascula: arriba y abajo -->
  <g stroke="#c8952a" stroke-width="5.5" fill="#c8952a" stroke-linecap="round">
    <line x1="232" y1="252" x2="232" y2="224"/>
    <polygon points="232,210 224,227 240,227" stroke="none"/>
    <line x1="266" y1="218" x2="266" y2="246"/>
    <polygon points="266,260 258,243 274,243" stroke="none"/>
  </g>
</svg>
